name: Apply Chapter 3 architecture rewrite v2

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_chapter3_rewrite_v2.yml
      - scripts/apply_chapter3_rewrite_v2.py
      - scripts/ch3_rewrite_v2/chapter3_template.tex
      - figures/src/make_ch3_architecture_figures.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chapter3-architecture-rewrite-v2
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure-generation dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Apply approved Chapter 3 rewrite
        run: python scripts/apply_chapter3_rewrite_v2.py

      - name: Generate Chapter 3 figures
        run: python figures/src/make_ch3_architecture_figures.py

      - name: Validate Chapter 3 source and figure contracts
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          git diff --check -- "$target" figures/src/make_ch3_architecture_figures.py
          test -s figures/fig_hied_two_path_architecture.pdf
          test -s figures/fig_worked_example_flow.pdf
          grep -F '\chapter{HiED Architecture and Stage-Wise Diagnostic Workflow}' "$target"
          grep -F '\section{Task Input, Diagnostic Scope, and Recorded Outputs}' "$target"
          grep -F '\label{tab:configured-profile-summary}' "$target"
          grep -F '\label{tab:hied-output-space}' "$target"
          grep -F '\includegraphics[width=1.0\textwidth]{fig_hied_two_path_architecture.pdf}' "$target"
          grep -F '\section{Single LLM Baseline and Comparison Contract}' "$target"
          grep -F '\subsection{Complete Constructed Transcript}' "$target"
          grep -F '\subsection{Criterion States and Missing Information}' "$target"
          grep -F '\subsection{DA and NtS Selection Results}' "$target"
          grep -F '\section{Chapter Summary}' "$target"
          ! grep -Fq '\chapter{Study Architectures and Diagnostic Workflow}' "$target"
          ! grep -Fq 'The study evaluates three retrieval conditions: no retrieval, global Top-5 retrieval, and parent-balanced retrieval.' "$target"
          ! grep -Fq 'fig_single_vs_hied_architecture.pdf' "$target"

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          pdftotext -layout main.pdf /tmp/main.txt
          grep -F 'HiED Architecture and Stage-Wise Diagnostic Workflow' /tmp/main.txt
          grep -F 'Task Input, Diagnostic Scope, and Recorded Outputs' /tmp/main.txt
          grep -F 'Single LLM Baseline and Comparison Contract' /tmp/main.txt
          grep -F 'Complete Constructed Transcript' /tmp/main.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'Unresolved references or citations found.' >&2
            exit 1
          fi
          if grep -q 'Overfull \\hbox' main.log; then
            echo 'Overfull boxes found.' >&2
            grep 'Overfull \\hbox' main.log >&2
            exit 1
          fi
          grep -E 'Underfull|Warning' main.log > /tmp/main_warnings.txt || true
          cat /tmp/main_warnings.txt

      - name: Render Chapter 3 pages for visual review
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification_renders
          pages=$(pdfinfo school/main.pdf | awk '/^Pages:/ {print $2}')
          start=''
          end=''
          for page in $(seq 1 "$pages"); do
            pdftotext -f "$page" -l "$page" -layout school/main.pdf /tmp/page.txt
            if [ -z "$start" ] && grep -Fq 'HiED Architecture and Stage-Wise Diagnostic Workflow' /tmp/page.txt; then
              start=$page
            fi
            if [ -n "$start" ] && grep -Fq 'Datasets, Label Projection, and Evaluation Protocol' /tmp/page.txt; then
              end=$((page - 1))
              break
            fi
          done
          test -n "$start"
          test -n "$end"
          pdftoppm -png -r 145 -f "$start" -l "$end" school/main.pdf verification_renders/chapter3
          printf 'Chapter 3 physical pages %s-%s\n' "$start" "$end" | tee /tmp/rendered_pages.txt

      - name: Commit verified Chapter 3 rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f figures/fig_single_vs_hied_architecture.pdf || true
          git add \
            school/main.tex \
            figures/fig_hied_two_path_architecture.pdf \
            figures/fig_worked_example_flow.pdf
          if git diff --cached --quiet; then
            echo 'No Chapter 3 change to commit.'
            exit 0
          fi
          git commit -m 'Reframe Chapter 3 around the HiED diagnostic workflow'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter3-architecture-rewrite-v2
          path: |
            school/main.pdf
            school/main.log
            figures/fig_hied_two_path_architecture.pdf
            figures/fig_worked_example_flow.pdf
            verification_renders/*.png
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
            /tmp/rendered_pages.txt
          if-no-files-found: warn
          retention-days: 7
