name: Audit Chapter 4 metric passages

on:
  push:
    branches:
      - fix/ch4-metric-contract-paper
    paths:
      - .github/workflows/audit_ch4_metric_context.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - name: Check out paper
        uses: actions/checkout@v4

      - name: Print all split and TF-IDF claims
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("school/main.tex")
          lines = path.read_text(encoding="utf-8").splitlines()
          needles = (
              "TF--IDF",
              "same-split",
              "same split",
              "same cases",
              "All internal methods",
              "conventional baseline",
              "conventional-classifier",
              "Route B",
              "public-validation",
              "Exact Match",
              "Macro-F1",
              "Weighted-F1",
          )
          matches = [
              (i + 1, line)
              for i, line in enumerate(lines)
              if any(needle in line for needle in needles)
          ]
          print(f"file={path} lines={len(lines)} matches={len(matches)}")
          for line_number, line in matches:
              print(f"{line_number:05d}: {line}")
          PY
