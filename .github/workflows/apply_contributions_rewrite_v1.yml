name: Apply Contributions rewrite v1

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_contributions_rewrite_v1.yml
      - scripts/apply_contributions_rewrite_v1.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributions-rewrite-v1
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply approved Contributions rewrite
        run: python scripts/apply_contributions_rewrite_v1.py

      - name: Validate source wording
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          git diff --check -- "$target"
          grep -F 'First, it proposes a stage-wise architecture for psychiatric decision support.' "$target"
          grep -F 'In 272 LingxiDiag-16K cases and 225 MDD-5k cases, at least one gold label was already in the Top-3 and the criterion-compatible set, but the system selected another primary diagnosis.' "$target"
          grep -F 'Second, it provides structured information for clinical review instead of only a final diagnosis.' "$target"
          grep -F 'Together, these contributions shift the focus from only predicting a final label to supporting stage-wise analysis and clinical review.' "$target"
          ! grep -Fq 'Compared with a Single LLM that mainly returns a final diagnostic output' "$target"
          ! grep -Fq 'This is a benchmark finding under the evaluated settings' "$target"
          ! grep -Fq 'Their effect on clinical speed, accuracy, and safety still requires direct clinical evaluation.' "$target"

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'Unresolved references or citations found.' >&2
            exit 1
          fi
          if grep -q 'Overfull \\hbox' main.log; then
            echo 'Overfull boxes found.' >&2
            grep 'Overfull \\hbox' main.log >&2
            exit 1
          fi
          grep -E 'Underfull|Warning' main.log > /tmp/main_warnings.txt || true

      - name: Commit verified Contributions rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school/main.tex
          if git diff --cached --quiet; then
            echo 'No thesis change to commit.'
            exit 0
          fi
          git commit -m 'Refocus Chapter 1 contributions on stage-wise support'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contributions-rewrite-v1
          path: |
            school/main.pdf
            school/main.log
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
          if-no-files-found: warn
          retention-days: 7
