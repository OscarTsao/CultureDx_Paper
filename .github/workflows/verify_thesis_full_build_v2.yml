name: Verify complete thesis build v2

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/verify_thesis_full_build_v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile from the thesis source directory
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          grep -E 'Overfull|Underfull|Warning' main.log > /tmp/main_warnings.txt || true
          cat /tmp/main_warnings.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'The complete build still contains unresolved references or citations.' >&2
            exit 1
          fi

      - name: Verify Chapter 4 content in the compiled source
        run: |
          grep -F '\label{sec:metric-audit-boundary}' school/main.tex
          grep -F 'Emitted-label hit@3' school/main.tex
          grep -F 'zero\_division=0' school/main.tex
          grep -F '0.177577' school/main.tex
