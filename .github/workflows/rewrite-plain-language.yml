name: Dump thesis rewrite source

on:
  push:
    branches:
      - agent/plain-language-main-chapters

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-main-chapters
          fetch-depth: 0
      - name: Decompress rewrite source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/scripts/rewrite-source-debug.py ]]; then
            echo 'debug source already exists'
            exit 0
          fi
          python3 - <<'PY'
          import ast, base64, re, zlib
          from pathlib import Path
          wrapper = Path('.github/scripts/rewrite_plain_language.py').read_text(encoding='utf-8')
          match = re.search(r"b64decode\((?P<payload>'[^']+')\)", wrapper)
          payload = ast.literal_eval(match.group('payload'))
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          Path('.github/scripts/rewrite-source-debug.py').write_text(source, encoding='utf-8')
          PY
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add .github/scripts/rewrite-source-debug.py
          git commit -m 'Expose rewrite source for repair'
          git push origin HEAD:agent/plain-language-main-chapters
