name: Diagnose thesis rewrite build

on:
  push:
    branches:
      - agent/plain-language-main-chapters

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-main-chapters
          fetch-depth: 0
      - name: Apply rewrite
        run: python3 .github/scripts/rewrite_plain_language_v4.py
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-xetex texlive-latex-extra texlive-pictures \
            texlive-lang-chinese fonts-liberation fonts-noto-cjk \
            fonts-urw-base35 poppler-utils
      - name: Build and save diagnostic log
        shell: bash
        run: |
          set +e
          : > build-error.log
          cd figures/src
          xelatex -interaction=nonstopmode -halt-on-error -file-line-error fig_pipeline_round20c_tikz.tex > ../../figure-build.log 2>&1
          fig_status=$?
          if [[ $fig_status -eq 0 ]]; then
            mv -f fig_pipeline_round20c_tikz.pdf ../fig_pipeline_round20c.pdf
          fi
          cd ../../school
          if [[ $fig_status -eq 0 ]]; then
            latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex > ../thesis-build.log 2>&1
            thesis_status=$?
          else
            thesis_status=99
          fi
          cd ..
          {
            echo '=== Figure build ==='
            tail -n 160 figure-build.log 2>/dev/null || true
            echo '=== Thesis build ==='
            tail -n 240 thesis-build.log 2>/dev/null || true
            echo "figure_status=$fig_status thesis_status=$thesis_status"
          } > build-error.log
          if [[ $fig_status -ne 0 || $thesis_status -ne 0 ]]; then
            git config user.name 'OpenAI Codex'
            git config user.email 'noreply@openai.com'
            git add build-error.log
            git commit -m 'Record thesis build failure'
            git push origin HEAD:agent/plain-language-main-chapters
            exit 1
          fi
