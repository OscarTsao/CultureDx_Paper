name: Audit rewritten thesis references

on:
  push:
    branches:
      - agent/plain-language-main-chapters

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plain-language-main-chapters
          fetch-depth: 0
      - name: Apply rewrite and record audit
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/rewrite_plain_language_v4.py
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          path = Path('school/main.tex')
          text = path.read_text(encoding='utf-8')
          labels = re.findall(r'\\label\{([^{}]+)\}', text)
          refs = []
          for raw in re.findall(r'\\(?:ref|pageref|autoref|cref|Cref)\{([^{}]+)\}', text):
              refs.extend(x.strip() for x in raw.split(',') if x.strip())
          counts = Counter(labels)
          missing = sorted(set(refs) - set(labels))
          duplicates = sorted(k for k, v in counts.items() if v > 1)
          forbidden_patterns = [
              r'\bcontract\b', r'\blineage\b', r'\bposthoc\b',
              r'emitted-label hit@3', r'genuine ranked Top-3',
              r'Trace-Lineage', r'forced-commit sweep', r'Evidence contract',
          ]
          forbidden = []
          for pattern in forbidden_patterns:
              for match in re.finditer(pattern, text, flags=re.IGNORECASE):
                  line = text.count('\n', 0, match.start()) + 1
                  forbidden.append(f'{line}: {pattern}: {text[match.start():match.end()]}')
          graphics = re.findall(r'\\includegraphics(?:\[[^\]]*\])?\{([^{}]+)\}', text)
          missing_graphics = []
          for name in graphics:
              candidates = [Path('school') / name, Path('figures') / name, Path(name)]
              if not any(p.exists() or p.with_suffix('.pdf').exists() or p.with_suffix('.png').exists() or p.with_suffix('.jpg').exists() for p in candidates):
                  missing_graphics.append(name)
          report = [
              f'labels={len(labels)} unique_labels={len(set(labels))}',
              f'references={len(refs)}',
              'MISSING REFERENCES:', *(missing or ['none']),
              'DUPLICATE LABELS:', *(duplicates or ['none']),
              'FORBIDDEN WORDING:', *(forbidden or ['none']),
              'MISSING GRAPHICS:', *(sorted(set(missing_graphics)) or ['none']),
          ]
          Path('static-rewrite-audit.log').write_text('\n'.join(report) + '\n', encoding='utf-8')
          print('\n'.join(report))
          PY
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add static-rewrite-audit.log
          git commit -m 'Record rewritten thesis reference audit'
          git push origin HEAD:agent/plain-language-main-chapters
