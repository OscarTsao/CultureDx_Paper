name: Apply post-defense thesis rewrite v2

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - scripts/apply_post_defense_rewrite_v2.py
      - .github/workflows/apply_post_defense_rewrite_v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rewrite branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply approved thesis changes
        run: python scripts/apply_post_defense_rewrite_v2.py

      - name: Validate edited source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f school/main.tex ]]; then
            target=school/main.tex
          else
            target=paper/school/HiED_school_version.tex
          fi
          git diff --check
          grep -F "stage-wise decision-support framework" "$target"
          grep -F "272 cases (29.7\\%)" "$target"
          grep -F "LingxiDiag psychiatrist annotation study" "$target"
          if grep -Fq "Ongoing CGMH Real-World Validation" "$target"; then
            echo "Obsolete CGMH evaluation subsection remains" >&2
            exit 1
          fi

      - name: Commit only the thesis revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f school/main.tex ]]; then
            target=school/main.tex
          else
            target=paper/school/HiED_school_version.tex
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          git rm scripts/apply_post_defense_rewrite_v2.py
          git rm .github/workflows/apply_post_defense_rewrite_v2.yml
          git commit -m "Post-defense revision: align thesis positioning and clinical scope"
          git push origin HEAD:thesis/post-defense-rewrite-v2
