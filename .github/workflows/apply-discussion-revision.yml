name: Apply Discussion literature-positioning revision

on:
  push:
    branches:
      - agent/revise-discussion-literature-positioning
    paths:
      - .github/workflows/apply-discussion-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/revise-discussion-literature-positioning
          fetch-depth: 0

      - name: Apply Discussion revision
        run: python3 .github/apply_discussion_revision.py school/main.tex

      - name: Validate revised Discussion
        run: |
          grep -Fq '\section{Interpreting Compatibility and Primary Commitment}' school/main.tex
          grep -Fq '\section{Relation to Existing Psychiatric LLM and Decision-Support Systems}' school/main.tex
          grep -Fq '\section{Why Additional Selection Inference Did Not Close the Gap}' school/main.tex
          grep -Fq '\section{Implications and Boundaries for Auditable Decision Support}' school/main.tex
          grep -Fq 'stage-wise observability and disagreement localization' school/main.tex
          grep -Fq '\citep{wang2025medkgi,ge2024dkec,kim2025clp}' school/main.tex
          grep -Fq 'fixed and possibly incomplete transcript' school/main.tex
          python3 - <<'PY'
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          start = text.index(r'\chapter{Discussion}')
          end = text.index(r'\chapter{Limitations and Threats to Validity}', start)
          block = text[start:end]
          assert block.count(r'\chapter{Discussion}') == 1
          assert block.count(r'\label{sec:discussion-primary-selection}') == 1
          assert block.count(r'\label{sec:discussion-related-systems}') == 1
          assert block.count(r'\label{sec:discussion-selection-strategies}') == 1
          assert block.count(r'\label{sec:discussion-set-scope-transfer}') == 1
          assert block.count(r'\label{sec:discussion-clinical-implications}') == 1
          assert 'An earlier F60 scope-expansion result could not be linked' not in block
          assert r'\section{Compatibility and Primary Selection in the Evaluated Trace}' not in block
          assert r'\section{Boundaries Beyond Primary Selection}' not in block
          PY
          git diff --check

      - name: Remove one-time files and commit
        run: |
          rm .github/apply_discussion_revision.py
          rm .github/workflows/apply-discussion-revision.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Revise Discussion literature positioning'
          git push origin HEAD:agent/revise-discussion-literature-positioning
