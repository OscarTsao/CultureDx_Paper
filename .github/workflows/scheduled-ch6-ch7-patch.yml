name: Scheduled Chapter 6-7 interpretation patch

on:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  patch-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-ch6-ch7-meaning-20260819

      - name: Apply, build, and push approved thesis patch
        shell: bash
        run: |
          if [ ! -f scripts/apply_ch6_ch7_meaning.py ]; then
            echo "Patch already applied; nothing to do."
            exit 0
          fi
          python3 scripts/apply_ch6_ch7_meaning.py school/main.tex
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-publishers \
            fonts-noto-cjk fonts-liberation2 fonts-urw-base35 poppler-utils
          fc-cache -f
          cd school
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eq "Undefined control sequence|LaTeX Error|Package .* Error|Emergency stop|Fatal error|There were undefined references|Citation .* undefined|Reference .* undefined|Missing character|Overfull \\\\hbox|Overfull \\\\vbox" main.log; then exit 1; fi
          pdftotext main.pdf main.txt
          grep -F "409 of 518 HiED cases" main.txt
          grep -F "190 losses versus 38 gains" main.txt
          cd ..
          git config user.name "Yu-Ning Tsao"
          git config user.email "186167885+OscarTsao@users.noreply.github.com"
          git rm -f .github/workflows/apply-ch6-ch7-meaning.yml scripts/apply_ch6_ch7_meaning.py
          git add school/main.tex
          git commit -m "docs: clarify the meaning of Chapter 6 and 7 results"
          git push origin HEAD:agent/clarify-ch6-ch7-meaning-20260819
