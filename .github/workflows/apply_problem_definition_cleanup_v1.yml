name: Apply Introduction focus cleanup v1

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_problem_definition_cleanup_v1.yml
      - scripts/apply_problem_definition_cleanup_v1.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: introduction-focus-cleanup-v1
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply approved Introduction cleanup
        run: python scripts/apply_problem_definition_cleanup_v1.py

      - name: Validate source wording
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          git diff --check -- "$target"
          grep -F 'A gold label may never enter the candidate list.' "$target"
          grep -F 'The main technical problem studied in this thesis is how to make these three diagnostic decisions separately visible.' "$target"
          grep -F 'It also allows different types of disagreement to be studied without treating every final-label mismatch as the same problem.' "$target"
          grep -F '\section{Overview of HiED and Study Scope}' "$target"
          grep -F 'This thesis proposes HiED, a hybrid, evidence-grounded multi-agent decision-support framework for Chinese psychiatric interview transcripts.' "$target"
          ! grep -Fq 'In this thesis, a benchmark or dataset reference label is a diagnosis supplied by the dataset for scoring.' "$target"
          ! grep -Fq 'A high final accuracy score also needs careful interpretation.' "$target"
          ! grep -Fq 'Cross-corpus testing is used as an additional boundary analysis rather than as the main contribution of HiED.' "$target"
          ! grep -Fq 'A Single LLM baseline reads a fixed transcript and directly returns a primary diagnosis.' "$target"

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'Unresolved references or citations found.' >&2
            exit 1
          fi
          if grep -q 'Overfull \\hbox' main.log; then
            echo 'Overfull boxes found.' >&2
            grep 'Overfull \\hbox' main.log >&2
            exit 1
          fi
          grep -E 'Underfull|Warning' main.log > /tmp/main_warnings.txt || true

      - name: Commit verified Introduction cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school/main.tex
          if git diff --cached --quiet; then
            echo 'No thesis change to commit.'
            exit 0
          fi
          git commit -m 'Keep the Introduction focused on the problem and HiED'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: introduction-focus-cleanup-v1
          path: |
            school/main.pdf
            school/main.log
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
          if-no-files-found: warn
          retention-days: 7
