name: Apply Chapter 7 external evaluation rewrite v1

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_ch7_external_rewrite_v1.yml
      - scripts/apply_ch7_external_rewrite_v1.py
      - scripts/ch7_tmp/**
      - figures/src/make_ch7_external_figure.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install figure dependency
        run: python -m pip install --disable-pip-version-check matplotlib

      - name: Apply Chapter 7 rewrite
        run: python scripts/apply_ch7_external_rewrite_v1.py

      - name: Generate external comparison figure
        run: python figures/src/make_ch7_external_figure.py

      - name: Validate Chapter 7 source contracts
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          test -s figures/fig_internal_external_gap.pdf
          git diff --check -- "$target" figures/fig_internal_external_gap.pdf
          grep -F '\section{External Populations and Trace Lineages}' "$target"
          grep -F '\section{External Recorded-Output Profiles}' "$target"
          grep -F '\section{Matched Primary-Selection Comparisons}' "$target"
          grep -F '\section{Trace-Lineage and Diagnostic-Scope Boundaries}' "$target"
          grep -F '\section{Cross-Corpus Lexical Transfer}' "$target"
          grep -F '\paragraph{Answer to RQ5.}' "$target"
          grep -F '225 cases (25.6\%)' "$target"
          grep -F 'Posthoc fixed-trace forced-commit sweep' "$target"
          grep -F '0.786' "$target"
          grep -F '0.059' "$target"
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('school/main.tex').read_text(encoding='utf-8')
          start = text.index(r'\chapter{External Synthetic Evaluation}')
          end = text.index(r'\chapter{Characterization of Recorded-Output Disagreements}', start)
          chapter = text[start:end]

          required_labels = {
              'ch:external', 'tab:external-inventory', 'tab:external-summary-rewrite',
              'fig:internal-external-gap', 'tab:external-disagreement-profiles',
              'sec:mdd-multiway', 'tab:mdd-finalization-results',
              'tab:scope-expansion-results', 'tab:external-trace-sensitivity',
              'tab:lexical-transfer-rewrite',
          }
          labels = re.findall(r'\\label\{([^}]+)\}', text)
          missing = sorted(required_labels - set(labels))
          duplicate = sorted({label for label in labels if labels.count(label) > 1})
          if missing or duplicate:
              raise SystemExit(f'missing labels={missing}; duplicate labels={duplicate}')

          forbidden = [
              '0.8907', '95.0\\%', '56.25\\%', '56.36\\%',
              '84.63\\%', '84.52\\%', '0.004', '0.096',
              'Forced pairwise override', '24,576', 'top_k', 'output budget',
              'serving setup',
          ]
          bad = [item for item in forbidden if item in chapter]
          if bad:
              raise SystemExit(f'Obsolete or implementation-specific text remains: {bad}')

          joint = [20, 71, 34, 134, 225, 394]
          if sum(joint) != 878:
              raise SystemExit(f'External D3/I/S counts do not sum to 878: {sum(joint)}')
          if 528 + 91 + 34 + 225 != 878:
              raise SystemExit('Four-group external summary does not sum to 878')
          if 394 + 225 != 619:
              raise SystemExit('Both-view denominator is inconsistent')
          print('Chapter 7 static validation passed')
          PY

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile and inspect complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          pdftotext -layout main.pdf /tmp/main.txt
          grep -F 'External Populations and Trace Lineages' /tmp/main.txt
          grep -F 'External Recorded-Output Profiles' /tmp/main.txt
          grep -F 'Matched Primary-Selection Comparisons' /tmp/main.txt
          grep -F 'Cross-Corpus Lexical Transfer' /tmp/main.txt
          grep -F 'Answer to RQ5' /tmp/main.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'The complete build contains unresolved references or citations.' >&2
            exit 1
          fi
          grep -E 'Overfull|Underfull|Warning' main.log > /tmp/main_warnings.txt || true
          cat /tmp/main_warnings.txt

      - name: Render updated comparison figure
        run: |
          mkdir -p verification_renders
          pdftoppm -png -r 180 -singlefile figures/fig_internal_external_gap.pdf verification_renders/fig_internal_external_gap
          test -s verification_renders/fig_internal_external_gap.png

      - name: Commit verified Chapter 7 rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school/main.tex figures/fig_internal_external_gap.pdf figures/src/make_ch7_external_figure.py
          if git diff --cached --quiet; then
            echo 'No Chapter 7 change to commit.'
            exit 0
          fi
          git commit -m 'Rewrite Chapter 7 external evaluation by trace lineage'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload build verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter7-external-rewrite-verification-v1
          path: |
            school/main.pdf
            school/main.log
            verification_renders/fig_internal_external_gap.png
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
          if-no-files-found: warn
          retention-days: 7
