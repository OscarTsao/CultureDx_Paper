name: Apply final thesis structure and layout fixes

on:
  push:
    branches:
      - agent/final-structure-layout-fixes
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-build-review-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-structure-layout-fixes
          fetch-depth: 0

      - name: Apply approved thesis fixes
        run: |
          set -euo pipefail
          python3 .github/final_structure_patch.py
          git diff --check

      - name: Compile Figure 3.1
        uses: xu-cheng/latex-action@v4
        with:
          root_file: fig_pipeline_round20c_tikz.tex
          working_directory: figures/src
          compiler: xelatex
          args: -file-line-error -halt-on-error -interaction=nonstopmode
          os: debian
          extra_system_packages: "fonts-liberation fonts-noto-cjk"

      - name: Install updated Figure 3.1
        run: |
          set -euo pipefail
          cp figures/src/fig_pipeline_round20c_tikz.pdf figures/fig_pipeline_round20c.pdf
          test -s figures/fig_pipeline_round20c.pdf

      - name: Compile full thesis
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: school
          compiler: latexmk
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
          os: debian
          extra_system_packages: "fonts-liberation fonts-noto-cjk poppler-utils"

      - name: Validate source and build
        run: |
          set -euo pipefail
          test -s school/main.pdf
          test -s school/main.log
          if grep -E -q 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log; then
            grep -E 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log || true
            exit 1
          fi
          test "$(grep -c 'Overfull \\hbox' school/main.log || true)" -eq 0
          test "$(grep -c 'Overfull \\vbox' school/main.log || true)" -eq 0
          grep -Fq '\section{Worked Example of the Two-Path Workflow}' school/main.tex
          grep -Fq '\section{Metric Recalculation and Result Provenance}' school/main.tex
          grep -Fq '\label{sec:clinical-evaluation-plan}' school/main.tex
          grep -Fq '\label{sec:lingxidiag-pilot-review}' school/main.tex
          grep -Fq '>{\raggedright\arraybackslash}X|' school/main.tex
          ! grep -Fq '\section{Study Sequence and Analysis Populations}' school/main.tex
          ! grep -Fq '\label{tab:analysis-populations}' school/main.tex
          ! grep -Fq '\section{Proposed Psychiatrist Review}' school/main.tex
          ! grep -Fq '\subsection{Case-Level Metric Audit and Recalculation Boundary}' school/main.tex
          grep -Fq '\draw[mainarrow] (transcript.east) -| (diagnostician.south);' figures/src/fig_pipeline_round20c_tikz.tex

      - name: Render changed layouts for visual review
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq poppler-utils
          mkdir -p visual-review
          pdftoppm -png -r 180 -singlefile figures/fig_pipeline_round20c.pdf visual-review/figure-3-1
          pages=$(pdfinfo school/main.pdf | awk '/^Pages:/ {print $2}')
          find_last_page() {
            pattern="$1"
            found=""
            for p in $(seq 1 "$pages"); do
              pdftotext -f "$p" -l "$p" school/main.pdf - 2>/dev/null | grep -Fq "$pattern" && found="$p" || true
            done
            test -n "$found"
            printf '%s' "$found"
          }
          worked_page=$(find_last_page 'Illustrative outputs from the two-path workflow')
          transfer_page=$(find_last_page 'TF–IDF with logistic regression within and across the two')
          pdftoppm -png -r 180 -f "$worked_page" -l "$worked_page" -singlefile school/main.pdf visual-review/worked-example
          pdftoppm -png -r 180 -f "$transfer_page" -l "$transfer_page" -singlefile school/main.pdf visual-review/table-7-4
          ls -lh visual-review

      - name: Upload visual-review renders
        uses: actions/upload-artifact@v4
        with:
          name: final-thesis-layout-review
          path: visual-review/*.png
          if-no-files-found: error
          retention-days: 7

      - name: Commit final source-only changes
        run: |
          set -euo pipefail
          pushd school
          latexmk -C main.tex || true
          rm -f main.pdf main.log main.aux main.bbl main.blg main.fdb_latexmk main.fls main.lof main.lot main.out main.toc main.xdv
          popd
          rm -f figures/src/fig_pipeline_round20c_tikz.aux \
            figures/src/fig_pipeline_round20c_tikz.log \
            figures/src/fig_pipeline_round20c_tikz.pdf
          rm -rf visual-review
          rm -f .github/final_structure_patch.py
          rm -f .github/workflows/apply-final-structure-fixes.yml
          git add -A
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev '^(school/main\.tex|figures/src/fig_pipeline_round20c_tikz\.tex|figures/fig_pipeline_round20c\.pdf|\.github/final_structure_patch\.py|\.github/workflows/apply-final-structure-fixes\.yml)$' || true)
          test -z "$unexpected"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Refine thesis structure and layout'
          git push origin HEAD:agent/final-structure-layout-fixes
