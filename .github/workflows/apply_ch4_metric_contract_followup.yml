name: Apply follow-up Chapter 4 split-scope correction

on:
  push:
    branches:
      - fix/ch4-metric-contract-paper
    paths:
      - .github/workflows/apply_ch4_metric_contract_followup.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out paper branch
        uses: actions/checkout@v4
        with:
          ref: fix/ch4-metric-contract-paper
          fetch-depth: 0

      - name: Apply follow-up correction
        run: python scripts/apply_ch4_metric_contract_followup.py

      - name: Validate source
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path("school/main.tex").read_text(encoding="utf-8")
          required = [
              "The preserved TF--IDF analysis is explicitly separated",
              "No direct Route B performance difference between TF--IDF and HiED is estimated",
              "zero case-ID overlap with Route B",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"missing required text: {missing}")
          forbidden = [
              "All internal methods are evaluated on the same fixed 1,000-case held-out set",
              "Main same-split comparison after configuration selection",
              "The main table compares complete TF--IDF, Single, and HiED configurations on the same cases",
              "The completed evidence therefore supports same-source held-out analysis",
          ]
          remaining = [item for item in forbidden if item in text]
          if remaining:
              raise SystemExit(f"unsupported statements remain: {remaining}")
          print("Follow-up source checks passed")
          PY

      - name: Commit corrected thesis source
        run: |
          if git diff --quiet -- school/main.tex; then
            echo "No source change was produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add school/main.tex
          git commit -m "fix: align residual Chapter 4 split-scope claims"
          git push origin HEAD:fix/ch4-metric-contract-paper
