name: Debug Chapter 4 follow-up matching

on:
  push:
    branches:
      - fix/ch4-metric-contract-paper
    paths:
      - .github/workflows/debug_ch4_followup.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ch4-metric-contract-paper
          fetch-depth: 0
      - name: Inspect source and match strings
        run: |
          git log -5 --oneline
          git status --short
          python - <<'PY'
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          print('sha-size', len(text))
          for line_no, line in enumerate(text.splitlines(), 1):
              if line.startswith('Training source &') or 'All internal methods are evaluated' in line or 'The main table compares complete TF--IDF' in line:
                  print(line_no, repr(line))
          old = 'Training source & 13,000 & Trains conventional baselines and builds the retrieval index; not used for final performance reporting'
          print('old repr', repr(old), 'count', text.count(old))
          print('patched marker count', text.count('Preserved TF--IDF metric-contract audit on the public-validation split'))
          print('main blob')
          PY
          git rev-parse HEAD:school/main.tex
