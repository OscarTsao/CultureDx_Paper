name: Apply Chapter 11 conclusions revision

on:
  push:
    branches:
      - agent/revise-conclusions-scope
    paths:
      - .github/workflows/apply-ch11-conclusions-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/revise-conclusions-scope
          fetch-depth: 0

      - name: Apply Chapter 11 revision
        run: python3 .github/apply_ch11_conclusions_revision.py school/main.tex

      - name: Validate revised Chapter 11
        run: |
          grep -Fq '\chapter{Conclusions and Future Work}' school/main.tex
          grep -Fq "HiED's completed technical contribution is a same-case stage-wise output and evaluation contract." school/main.tex
          grep -Fq 'Retrieval produces consistently higher Top-1 point estimates for Single than no retrieval.' school/main.tex
          grep -Fq 'The same stage-wise output views remain applicable to MDD-5k' school/main.tex
          grep -Fq 'the only retained follow-up study is the blinded LingxiDiag psychiatrist annotation' school/main.tex
          grep -Fq 'broader clinical validation and deployment remain independent future research.' school/main.tex
          ! grep -Fq 'Retrieval gives a clear Top-1 benefit for Single.' school/main.tex
          python3 - <<'PY'
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          start = text.index(r'\chapter{Conclusions and Future Work}')
          end = text.index(r'\appendix', start)
          block = text[start:end]
          assert block.count(r'\section{Summary of Findings}') == 1
          assert block.count(r'\section{Answers to the Research Questions}') == 1
          assert block.count(r'\section{Future Work}') == 1
          assert block.count(r'\item[RQ1]') == 1
          assert block.count(r'\item[RQ2]') == 1
          assert block.count(r'\item[RQ3]') == 1
          assert block.count(r'\item[RQ4]') == 1
          assert block.count(r'\item[RQ5]') == 1
          assert 'superior generalization by HiED' in block
          assert text.count(r'\label{ch:conclusion}') == 1
          PY
          git diff --check

      - name: Remove one-time files and commit
        run: |
          rm .github/apply_ch11_conclusions_revision.py
          rm .github/workflows/apply-ch11-conclusions-revision.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add school/main.tex .github/apply_ch11_conclusions_revision.py .github/workflows/apply-ch11-conclusions-revision.yml
          git diff --cached --check
          git commit -m 'Revise Chapter 11 conclusions and future work'
          git push origin HEAD:agent/revise-conclusions-scope
