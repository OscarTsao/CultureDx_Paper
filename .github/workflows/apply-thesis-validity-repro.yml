name: Apply thesis validity and reproducibility patch

on:
  push:
    branches:
      - agent/final-thesis-validity-repro-patch
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  patch-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-thesis-validity-repro-patch
          fetch-depth: 0

      - name: Apply approved thesis patch
        run: |
          set -euo pipefail
          python3 .github/thesis_patch_loader.py
          git diff --check

      - name: Compile full thesis
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          working_directory: school
          compiler: latexmk
          args: -xelatex -file-line-error -halt-on-error -interaction=nonstopmode
          os: debian
          extra_system_packages: "fonts-liberation fonts-noto-cjk poppler-utils"

      - name: Validate thesis build
        run: |
          set -euo pipefail
          test -s school/main.pdf
          test -s school/main.log
          if grep -E -q 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log; then
            grep -E 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log || true
            exit 1
          fi
          test "$(grep -c 'Overfull \\hbox' school/main.log || true)" -eq 0
          test "$(grep -c 'Overfull \\vbox' school/main.log || true)" -eq 0
          grep -Fq 'final-primary-output disagreement profile' school/main.tex
          grep -Fq 'L_{\mathrm{cat}}(x)' school/main.tex
          grep -Fq 'L_{\mathrm{par}}(x)' school/main.tex
          grep -Fq 'Main-System Configuration' school/main.tex
          grep -Fq 'Complete internal $D_3/I/S$ profiles' school/main.tex
          ! grep -Fq 'Supplementary Upper-Bound Analysis' school/main.tex
          ! grep -Fq 'A secondary F32--F41 analysis is reported separately' school/main.tex

      - name: Commit source-only patch
        run: |
          set -euo pipefail
          git clean -fdx school
          rm -rf .github/thesis_patch
          rm -f .github/thesis_patch_loader.py
          rm -f .github/workflows/apply-thesis-validity-repro.yml
          git add -A
          git diff --cached --check
          git status --short
          unexpected=$(git diff --cached --name-only | grep -Ev '^(school/main\.tex|\.github/thesis_patch/.*|\.github/thesis_patch_loader\.py|\.github/workflows/apply-thesis-validity-repro\.yml)$' || true)
          if [ -n "$unexpected" ]; then
            printf 'Unexpected staged files:\n%s\n' "$unexpected"
            exit 1
          fi
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Clarify thesis validity and reproducibility boundaries'
          git push origin HEAD:agent/final-thesis-validity-repro-patch
