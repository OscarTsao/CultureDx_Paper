name: Apply final abstract revision

on:
  push:
    branches:
      - agent/final-abstract-revision

permissions:
  contents: write

jobs:
  update-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-abstract-revision
          fetch-depth: 0

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-bibtex-extra fonts-noto-cjk poppler-utils

      - name: Replace Chinese and English abstracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('school/main.tex')
          text = source.read_text(encoding='utf-8')

          zh_marker = r'\chapter*{中文摘要}'
          en_marker = r'\chapter*{Abstract}'
          ack_marker = r'\chapter*{Acknowledgements}'

          assert text.count(zh_marker) == 1, 'Chinese abstract marker count changed'
          assert text.count(en_marker) == 1, 'English abstract marker count changed'
          assert text.count(ack_marker) == 1, 'Acknowledgements marker count changed'

          zh_start = text.index(zh_marker)
          en_start = text.index(en_marker)
          ack_start = text.index(ack_marker)
          assert zh_start < en_start < ack_start

          chinese = r'''\chapter*{中文摘要}
          \addcontentsline{toc}{chapter}{中文摘要}
          精神科初診逐字稿中的鑑別診斷，是在證據不完整下進行的比較式決策。多個疾病可能同時與同一份逐字稿相容，但系統仍須選出一個最終主診斷，並視需要保留共病。用來區分疾病的病程、發病時序、排除病因與共病關係，未必會在單次晤談中被完整引出。大型語言模型雖能處理這類逐字稿，但流暢輸出不代表可靠的鑑別診斷能力。

          既有基準顯示，模型從粗粒度分類進入疾病層級鑑別時，表現會明顯下降。然而，多數評估仍只呈現最終診斷結果，無法說明分歧是因為參考診斷未進入候選、未通過準則核對，或已被保留卻未被選為最終主診斷。這些情況對應不同的系統問題，也需要不同的改善方法。

          本研究提出 HiED，一套用於中文精神科逐字稿的混合式、以證據為基礎的多代理框架。診斷路徑產生排序候選與初步主診斷；準則核對路徑將診斷準則判定為符合、不符合或資訊不足，並形成準則相容集合。HiED 分別保存 Top-3、準則狀態、準則相容集合與最終主診斷，使候選覆蓋、準則相容與主診斷選擇能被分開評估。

          在固定的 1,000 例 LingxiDiag-16K 內部保留測試集上，HiED 的 Top-1 Accuracy 為 51.8\%，Top-3 Accuracy 為 80.2\%。其 Top-1 與 Single LLM 幾乎相同；TF--IDF 搭配 logistic regression（LR）在同來源資料上較強，但跨來源時明顯下降。最大已記錄分歧類型為參考診斷已進入 Top-3 並存在於準則相容集合，卻未被選為最終主診斷；此類型占內部案例的 29.7\%，在 MDD-5k 中占 25.6\%。所測試的主診斷選擇方法均未明確優於 Direct-Answer。

          HiED 並未證明最終診斷準確率較高，也不能證明最終選擇模組單獨造成分歧。其兩項主要貢獻是提出可稽核的雙路徑架構，以及用於定位基準分歧的分階段評估框架。本文所稱的臺灣脈絡是預期應用情境；所有完成的量化結果皆來自合成中文逐字稿，不構成臺灣臨床驗證。

          \noindent\textbf{關鍵詞：}大型語言模型、多代理系統、精神科鑑別診斷、診斷準則、臨床決策支援、可稽核人工智慧
          '''

          english = r'''\chapter*{Abstract}
          \addcontentsline{toc}{chapter}{Abstract}
          Differential diagnosis from an initial psychiatric interview transcript is a comparative decision under incomplete evidence. Several disorders may fit the same transcript, yet one must still be selected as the primary diagnosis. Key distinctions---illness course, onset timing, exclusionary causes, and comorbidity---may not be fully elicited in one interview. Large language models can process such transcripts, but fluent output does not guarantee reliable differential diagnosis.

          Existing benchmarks show a marked drop from coarse classification to disorder-level differential diagnosis. Most evaluations still report only the final diagnosis and cannot show whether disagreement arose because a reference diagnosis was omitted from the candidates, rejected by criterion checking, or retained but not selected as the final primary diagnosis.

          This thesis proposes HiED, a hybrid, evidence-grounded multi-agent framework for Chinese psychiatric transcripts. The diagnosis path produces ranked candidates and a proposed primary diagnosis. The criterion-checking path assigns met, not met, or insufficient evidence states and forms a criterion-compatible set. HiED preserves the Top-3, criterion states, criterion-compatible set, and final primary diagnosis for stage-wise evaluation.

          On a 1,000-case LingxiDiag-16K held-out set, HiED achieved 51.8\% Top-1 Accuracy and 80.2\% Top-3 Accuracy. Its Top-1 was almost identical to that of the Single LLM, while TF--IDF with logistic regression was stronger on same-source data but declined across sources. The largest recorded disagreement group contained cases in which a reference diagnosis appeared in both the Top-3 and the criterion-compatible set but was not selected as the final primary diagnosis. This group accounted for 29.7\% internally and 25.6\% on MDD-5k. None of the tested selection methods clearly improved over Direct-Answer.

          HiED does not establish superior final-diagnosis accuracy or a clinically validated causal bottleneck. Its two main contributions are an auditable two-path architecture and a stage-wise evaluation framework for locating benchmark disagreement. The Taiwanese context denotes the intended application setting; all quantitative results come from synthetic Chinese transcripts and do not constitute clinical validation in Taiwan.

          \noindent\textbf{Keywords:} Large language models, multi-agent systems, psychiatric differential diagnosis, diagnostic criteria, clinical decision support, auditable AI
          '''

          updated = text[:zh_start] + chinese.strip() + '\n' + english.strip() + '\n' + text[ack_start:]
          source.write_text(updated, encoding='utf-8')

          assert 'TF--IDF 搭配 logistic regression（LR）' in updated
          assert 'Existing benchmarks show a marked drop' in updated
          assert 'ongoing real-patient validation' not in updated[zh_start:ack_start]
          assert '長庚紀念醫院進行中' not in updated[zh_start:ack_start]
          PY

      - name: Compile full thesis
        working-directory: school
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex

      - name: Validate build and one-page abstracts
        working-directory: school
        run: |
          test -s main.pdf
          ! grep -Fq 'There were undefined references' main.log
          ! grep -Fq 'Citation' main.log || ! grep -Fq 'undefined' main.log
          ! grep -Fq 'Overfull \\hbox' main.log
          ! grep -Fq 'Overfull \\vbox' main.log
          ! grep -Fq 'Missing character:' main.log

          pdftotext -f 2 -l 2 main.pdf /tmp/page2.txt
          pdftotext -f 3 -l 3 main.pdf /tmp/page3.txt
          pdftotext -f 4 -l 4 main.pdf /tmp/page4.txt

          grep -q '中文摘要' /tmp/page2.txt
          grep -q '關鍵詞' /tmp/page2.txt
          ! grep -q '^Abstract$' /tmp/page2.txt

          grep -q '^Abstract$' /tmp/page3.txt
          grep -q 'Keywords' /tmp/page3.txt
          ! grep -q 'Acknowledgements' /tmp/page3.txt

          grep -q 'Acknowledgements' /tmp/page4.txt

      - name: Render abstract pages
        working-directory: school
        run: |
          mkdir -p abstract-review
          pdftoppm -f 2 -l 3 -png -r 150 main.pdf abstract-review/abstract

      - name: Upload abstract review renders
        uses: actions/upload-artifact@v4
        with:
          name: final-abstract-review
          path: school/abstract-review/*.png

      - name: Commit source-only abstract revision
        run: |
          git config user.name 'Yu-Ning Tsao'
          git config user.email '186167885+OscarTsao@users.noreply.github.com'
          git add school/main.tex
          git rm .github/workflows/apply-final-abstract-revision.yml
          git commit -m 'Refine Chinese and English abstracts'
          git push origin agent/final-abstract-revision
