name: Apply Chapter 2 plain-English rewrite v1

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_ch2_plain_v1.yml
      - scripts/apply_ch2_plain_v1.py
      - scripts/ch2_plain_v1/chapter2.tex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ch2-plain-v1
  cancel-in-progress: false

jobs:
  rewrite-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Chapter 2 rewrite
        run: python scripts/apply_ch2_plain_v1.py school/main.tex

      - name: Validate Chapter 2 source and readability
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          git diff --check -- "$target"
          grep -F '\chapter{Related Work}' "$target"
          grep -F '\section{Retrieval with Similar Cases}' "$target"
          grep -F '\section{Medical Multi-Agent Systems}' "$target"
          grep -F '\section{Auditability and Criterion-Level Records}' "$target"
          grep -F '\section{Primary Diagnosis Selection}' "$target"
          grep -F 'A final score does not show whether a reference diagnosis was never proposed' "$target"
          grep -F 'A retrieved case describes another patient or synthetic case.' "$target"
          grep -F 'More agents or more discussion rounds do not automatically lead to better diagnostic accuracy.' "$target"
          grep -F 'Criterion-level outputs are therefore model records that can be reviewed.' "$target"
          grep -F 'Compatibility alone does not show whether a diagnosis should be primary' "$target"
          ! grep -Fq 'criterion-grounded audit records' "$target"
          ! grep -Fq 'fine-grained differential diagnosis' "$target"
          ! grep -Fq 'This creates an attribution problem' "$target"
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('school/main.tex').read_text(encoding='utf-8')
          start = text.index(r'\chapter{Related Work}')
          end = text.index(r'\chapter{Study Architectures and Diagnostic Workflow}', start)
          chapter = text[start:end]
          prose = re.sub(r'\\cite[pt]?\{[^}]+\}', '', chapter)
          prose = re.sub(r'\\[A-Za-z@]+(?:\[[^\]]*\])?\{([^{}]*)\}', r'\1', prose)
          prose = re.sub(r'\\[A-Za-z@]+', ' ', prose)
          prose = re.sub(r'[$&%#_{}|~^]', ' ', prose)
          sentences = [s.strip() for s in re.split(r'(?<=[.!?])\s+', prose) if len(s.split()) >= 5]
          lengths = sorted(len(s.split()) for s in sentences)
          if not lengths:
              raise SystemExit('No Chapter 2 sentences found for readability check.')
          median = lengths[len(lengths)//2]
          p90 = lengths[min(len(lengths)-1, int(0.9 * len(lengths)))]
          print(f'Chapter 2 prose sentences={len(lengths)}, median words={median}, p90 words={p90}, max words={max(lengths)}')
          if median > 22 or p90 > 34:
              raise SystemExit('Chapter 2 sentence lengths remain above the plain-English target.')
          PY

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          pdftotext -layout main.pdf /tmp/main.txt
          grep -F 'Related Work' /tmp/main.txt
          grep -F 'Retrieval with Similar Cases' /tmp/main.txt
          grep -F 'Auditability and Criterion-Level Records' /tmp/main.txt
          grep -F 'Research Gap and Research Questions' /tmp/main.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'Unresolved references or citations found.' >&2
            exit 1
          fi
          grep -E 'Overfull|Underfull|Warning' main.log > /tmp/main_warnings.txt || true
          cat /tmp/main_warnings.txt

      - name: Reject overfull boxes in Chapter 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('school/main.tex').read_text(encoding='utf-8')
          log = Path('school/main.log').read_text(encoding='utf-8', errors='replace')
          start_pos = source.index(r'\chapter{Related Work}')
          end_pos = source.index(r'\chapter{Study Architectures and Diagnostic Workflow}', start_pos)
          start_line = source[:start_pos].count('\n') + 1
          end_line = source[:end_pos].count('\n') + 1
          offenders = []
          for match in re.finditer(r'Overfull .*? at lines (\d+)(?:--(\d+))?', log):
              lo = int(match.group(1))
              hi = int(match.group(2) or lo)
              if not (hi < start_line or lo > end_line):
                  offenders.append(match.group(0))
          if offenders:
              raise SystemExit('Chapter 2 contains overfull boxes: ' + '; '.join(offenders))
          print(f'Chapter 2 line range {start_line}-{end_line} has no overfull boxes')
          PY

      - name: Render Chapter 2 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification_renders
          pages=$(pdfinfo school/main.pdf | awk '/^Pages:/ {print $2}')
          start_page=''
          next_page=''
          for page in $(seq 1 "$pages"); do
            pdftotext -f "$page" -l "$page" -layout school/main.pdf /tmp/page.txt
            if [ -z "$start_page" ] && grep -Fq 'Related Work' /tmp/page.txt; then
              start_page="$page"
              continue
            fi
            if [ -n "$start_page" ] && grep -Fq 'Study Architectures and Diagnostic Workflow' /tmp/page.txt; then
              next_page="$page"
              break
            fi
          done
          test -n "$start_page"
          if [ -z "$next_page" ]; then next_page=$((start_page + 9)); fi
          end_page=$((next_page - 1))
          pdftoppm -png -r 155 -f "$start_page" -l "$end_page" school/main.pdf verification_renders/ch2
          printf 'Chapter 2 physical PDF pages: %s-%s\n' "$start_page" "$end_page" | tee /tmp/ch2_pages.txt
          test "$(find verification_renders -name 'ch2-*.png' | wc -l)" -ge 3

      - name: Commit verified Chapter 2 rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school/main.tex
          if git diff --cached --quiet; then
            echo 'No Chapter 2 change to commit.'
            exit 0
          fi
          git commit -m 'Rewrite Chapter 2 in plain technical English'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload Chapter 2 verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-plain-english-v1
          path: |
            school/main.pdf
            school/main.log
            verification_renders/ch2-*.png
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
            /tmp/ch2_pages.txt
          if-no-files-found: warn
          retention-days: 7
