name: Reframe psychiatrist review as future work

"on":
  push:
    branches:
      - agent/psychiatrist-review-future-work

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: agent/psychiatrist-review-future-work
          fetch-depth: 0

      - name: Patch and validate thesis source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "OscarTsao/CultureDx_Paper" ]]; then
            TARGET="school/main.tex"
          else
            TARGET="paper/school/HiED_school_version.tex"
          fi
          python3 .github/reframe_psychiatrist_review.py "$TARGET"
          grep -Fq 'Proposed Single-Psychiatrist Review of Benchmark-Label Alignment (Future Work)' "$TARGET"
          grep -Fq 'One psychiatrist will review the selected transcripts' "$TARGET"
          grep -Fq 'No psychiatrist review was completed within the thesis period' "$TARGET"
          grep -Fq 'Conduct a single-psychiatrist review of benchmark-label alignment' "$TARGET"
          ! grep -Fq 'Two psychiatrists will independently review all cases' "$TARGET"
          ! grep -Fq 'Pending blinded psychiatrist annotation protocol' "$TARGET"
          ! grep -Fq 'Complete and report the LingxiDiag psychiatrist annotation study' "$TARGET"
          git diff --check

      - name: Install XeLaTeX toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-xetex texlive-latex-extra texlive-publishers \
            texlive-lang-chinese fonts-liberation fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile full thesis
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "OscarTsao/CultureDx_Paper" ]]; then
            WORKDIR="school"
            TEXFILE="main.tex"
            STEM="main"
          else
            WORKDIR="paper/school"
            TEXFILE="HiED_school_version.tex"
            STEM="HiED_school_version"
          fi
          cd "$WORKDIR"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error "$TEXFILE"
          test -s "$STEM.pdf"
          if grep -E -q 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' "$STEM.log"; then
            exit 1
          fi
          test "$(grep -c 'Overfull \\hbox' "$STEM.log" || true)" -eq 0
          test "$(grep -c 'Overfull \\vbox' "$STEM.log" || true)" -eq 0
          pdfinfo "$STEM.pdf" | grep -E '^(Pages|Page size):'

      - name: Commit source-only changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "OscarTsao/CultureDx_Paper" ]]; then
            WORKDIR="school"
            STEM="main"
            ALLOWED='^(school/main.tex|\.github/reframe_psychiatrist_review.py|\.github/workflows/reframe-psychiatrist-review.yml)$'
          else
            WORKDIR="paper/school"
            STEM="HiED_school_version"
            ALLOWED='^(paper/school/HiED_school_version.tex|\.github/reframe_psychiatrist_review.py|\.github/workflows/reframe-psychiatrist-review.yml)$'
          fi
          cd "$WORKDIR"
          latexmk -C "$STEM.tex" || true
          rm -f "$STEM".aux "$STEM".bbl "$STEM".blg "$STEM".fdb_latexmk \
            "$STEM".fls "$STEM".log "$STEM".lof "$STEM".lot "$STEM".out \
            "$STEM".pdf "$STEM".toc "$STEM".xdv
          cd - >/dev/null
          rm -f .github/reframe_psychiatrist_review.py
          rm -f .github/workflows/reframe-psychiatrist-review.yml
          git add -A
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          test -z "$unexpected"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Reframe psychiatrist review as future work'
          git push origin HEAD:agent/psychiatrist-review-future-work
