name: Revise Chapter 3 architecture

on:
  push:
    branches:
      - agent/ch03-architecture-review
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  revise:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: agent/ch03-architecture-review
          fetch-depth: 0

      - name: Apply Chapter 3 patch
        run: |
          set -euo pipefail
          python3 .github/scripts/revise_ch03_loader.py
          if [ -f school/main.tex ]; then
            git show 4a50af1113d9d456e33c2bd49e52a90d5fd5390e:figures/fig_pipeline_round20c.pdf > figures/fig_pipeline_round20c.pdf
          else
            git show 0df66c3f0d104521c9ec74dd5078ea020da7de2a:paper/figures/fig_pipeline_round20c.pdf > paper/figures/fig_pipeline_round20c.pdf
          fi
          git diff --check

      - name: Commit Chapter 3-only revision
        run: |
          set -euo pipefail
          if [ -f school/main.tex ]; then
            ALLOWED='^(school/main.tex|figures/src/fig_pipeline_round20c_tikz.tex|figures/fig_pipeline_round20c.pdf|\.github/scripts/.*|\.github/workflows/revise-ch03.yml)$'
          else
            ALLOWED='^(paper/school/HiED_school_version.tex|paper/figures/src/fig_pipeline_round20c_tikz.tex|paper/figures/fig_pipeline_round20c.pdf|\.github/scripts/.*|\.github/workflows/revise-ch03.yml)$'
          fi
          rm -rf .github/scripts/ch03_parts
          rm -f .github/scripts/revise_ch03.py
          rm -f .github/scripts/revise_ch03_loader.py
          rm -f .github/workflows/revise-ch03.yml
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          test -z "$unexpected"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Rewrite Chapter 3 architecture'
          git push origin HEAD:agent/ch03-architecture-review
