name: Apply final Chapter 6 and Appendix B polish

on:
  push:
    branches:
      - agent/final-ch6-appendix-polish-20260819

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-ch6-appendix-polish-20260819
          fetch-depth: 0

      - name: Patch thesis source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("school/main.tex")
          text = path.read_text(encoding="utf-8")

          pairs = [
              (
                  """Exact Match and F1 describe the complete diagnosis set rather than only
          the primary diagnosis. Differences in these measures should therefore
          not be interpreted as the effect of the multi-agent architecture alone.""",
                  """The set-based measures answer a different question from Top-1.
          Exact Match is an all-or-nothing case measure: one additional or
          missing diagnosis makes the complete set incorrect. This explains why
          the one-label Majority baseline can have an Exact Match of 0.327 but a
          Macro-F1 of only 0.047.

          HiED has the highest Exact Match, at 0.409, but this does not mean that
          it has the best label-level performance. Among the 518 cases in which
          HiED selects a reference diagnosis as primary, 109 still have a
          different complete diagnosis set because of an additional or missing
          diagnosis. Chapter~\\ref{ch:error} provides the case-level breakdown.

          Macro-F1 and Weighted-F1 instead combine label-level precision and
          recall across all cases. Macro-F1 gives all twelve scoring classes equal
          weight, including rare classes and \\emph{Others}, whereas Weighted-F1
          is influenced mainly by the frequent F32 and F41 labels. HiED cannot
          emit \\emph{Others}. Single's Exact Match of 0.029 therefore means that
          its complete emitted set rarely equals the reference set, not that its
          primary diagnosis is almost always incorrect. Because only aggregate
          baseline results were retained, this thesis does not assign a more
          specific case-level cause to that value.

          These set-based differences describe the complete system outputs and
          should not be attributed to the multi-agent architecture alone.""",
              ),
              (
                  "Posthoc forced-commit sweep & External-only deterministic replay that promotes each valid preference already stored in the matched MDD-5k pairwise trace. & Fixed-trace policy replay; not a separately executed model configuration and not reported as an internal result.\\\\",
                  "Forced pairwise override & External-only deterministic replay that promotes each valid preference already stored in the matched MDD-5k pairwise trace. & Fixed-trace policy replay; not a separately executed model configuration and not reported as an internal result.\\\\",
              ),
              (
                  "The posthoc forced-commit result is different. It replays valid preferences already stored in the matched MDD-5k pairwise trace and adds no model call. It is not a separately executed pipeline, and no matching internal result is reported.",
                  "The forced pairwise override is different. It applies valid preferences already stored in the matched MDD-5k pairwise trace to the final primary diagnosis and adds no model call. It is a fixed-trace deterministic replay rather than a separately executed pipeline, and no matching internal result is reported.",
              ),
              (
                  "DA versus posthoc forced-commit sweep & 28 & 5 & $6.6\\times10^{-5}$\\\\",
                  "DA versus forced pairwise override & 28 & 5 & $6.6\\times10^{-5}$\\\\",
              ),
              (
                  """32B & 0.465 & 0.518 & 0.803 & None\\\\
          \\hline
          \\end{tabularx}
          \\renewcommand{\\arraystretch}{1.0}
          \\end{table}

          \\chapter{End-to-End Workflow Example and Case-Level System Outputs}""",
                  """32B & 0.465 & 0.518 & 0.803 & None\\\\
          \\hline
          \\end{tabularx}
          \\renewcommand{\\arraystretch}{1.0}
          \\end{table}

          \\noindent\\textit{Run provenance.} The 32B row comes from the separate
          post-freeze model-size sweep rather than the validation-selected canonical
          run reported in Table~\\ref{tab:matched-baselines-retrieval}. Its Top-3
          value is therefore 0.803 rather than 0.802.

          \\chapter{End-to-End Workflow Example and Case-Level System Outputs}""",
              ),
          ]

          for old, new in pairs:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one exact match, found {count}: {old[:100]!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

          grep -F "The set-based measures answer a different question from Top-1." school/main.tex
          grep -F "DA versus forced pairwise override" school/main.tex
          grep -F "Run provenance." school/main.tex
          ! grep -Fq "posthoc forced-commit" school/main.tex

      - name: Install and compile
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-publishers \
            fonts-noto-cjk fonts-liberation2 fonts-urw-base35
          fc-cache -f
          cd school
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eq "Undefined control sequence|LaTeX Error|Package .* Error|Emergency stop|Fatal error|There were undefined references|Citation .* undefined|Reference .* undefined|Missing character|Overfull \\\\hbox|Overfull \\\\vbox" main.log; then
            exit 1
          fi

      - name: Commit final source only
        shell: bash
        run: |
          rm -f .github/workflows/final-ch6-appendix-polish.yml
          git config user.name "Yu-Ning Tsao"
          git config user.email "186167885+OscarTsao@users.noreply.github.com"
          git add school/main.tex .github/workflows/final-ch6-appendix-polish.yml
          git diff --cached --check
          git commit -m "Clarify set-based metrics and appendix provenance"
          git push origin HEAD:agent/final-ch6-appendix-polish-20260819
