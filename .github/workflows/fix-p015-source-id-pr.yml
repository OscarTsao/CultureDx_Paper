name: Apply P015 source-ID correction

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch thesis wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("school/main.tex")
          s = p.read_text(encoding="utf-8")
          pairs = [
            ("transcript for synthetic LingxiDiag case P015 and the corresponding raw\nHiED-generated system report. The two source documents are the input and\nsystem-output views of the same case rather than two different cases.",
             "transcript for LingxiDiag source case 364295726 and the corresponding raw\nHiED-generated system report. This case was assigned the blinded study\nidentifier P015 for review materials. The two source documents are the\ninput and system-output views of the same case rather than two different\ncases."),
            ("This appendix reproduces the complete textual content of two attached\nsource documents for the same synthetic LingxiDiag case, P015. The first\nis the two-page speaker-labeled transcript supplied to the system.",
             "This appendix reproduces the complete textual content of two attached\nsource documents for the same synthetic LingxiDiag source case,\n364295726. The case was assigned the blinded study identifier P015 in the\nreview materials. The first is the two-page speaker-labeled transcript\nsupplied to the system."),
            (r"\caption{Crosswalk between the P015 artifacts and the HiED workflow.}", r"\caption{Crosswalk between LingxiDiag source case 364295726 (blinded study ID P015) and the HiED workflow.}"),
            (r"Input & A two-page, speaker-labeled synthetic LingxiDiag transcript for blinded case P015.\\", r"Input & A two-page, speaker-labeled synthetic LingxiDiag transcript for source case 364295726, presented under blinded study ID P015.\\"),
            (r"Interpretation boundary & Both documents concern a synthetic case. The report is automatically generated and has not been reviewed or validated by a psychiatrist.\\", r"Interpretation boundary & Both documents concern LingxiDiag source case 364295726. P015 is the blinded study ID used in the review materials. The report is automatically generated and has not been reviewed or validated by a psychiatrist.\\"),
            ("\\emph{HiED-generated system report for case P015}. The source case\nidentifier printed in the report is retained because the case is\nsynthetic; P015 remains the blinded identifier used in this thesis.",
             "\\emph{HiED-generated system report for blinded study case P015}. The\ncorresponding LingxiDiag source case ID is 364295726. P015 is a blinded\nstudy identifier, not the original dataset case ID. The mapping is shown\nin this appendix for reproducibility; reviewer-facing blinded materials\nshould display P015 without the source ID."),
            (r"\section{Synthetic Input Transcript for Case P015}", r"\section{Synthetic Input Transcript for LingxiDiag Source Case 364295726 (Blinded ID P015)}"),
            ("The following pages reproduce the attached transcript in searchable text.\nSpacing and line breaks follow the source-page extraction as closely as\npossible; the wording is unchanged.",
             "The following pages reproduce the attached transcript in searchable text.\nThe source pages display the blinded study ID P015; the corresponding\nLingxiDiag source case ID is 364295726. Spacing and line breaks follow the\nsource-page extraction as closely as possible; the wording is unchanged."),
            (r"\section{Raw HiED-Generated System Report for Case P015}", r"\section{Raw HiED-Generated System Report for LingxiDiag Source Case 364295726 (Blinded ID P015)}"),
            ("The following pages reproduce the attached system report in searchable\ntext. The report is included as a workflow artifact only. Its diagnostic",
             "The following pages reproduce the attached system report in searchable\ntext. Unlike the transcript, the report prints both P015 and source case ID\n364295726. The report is included as a workflow artifact only. Its diagnostic"),
          ]
          for old, new in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"Expected exactly one match, found {n}: {old[:90]!r}")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          PY
          grep -F "LingxiDiag source case 364295726" school/main.tex
          grep -F "P015 is a blinded" school/main.tex
          ! grep -Fq "synthetic LingxiDiag case P015" school/main.tex

      - name: Install and compile
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra fonts-noto-cjk fonts-liberation2 fonts-urw-base35
          fc-cache -f
          cd school
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          ! grep -Eq "Undefined control sequence|LaTeX Error|Package .* Error|Emergency stop|Fatal error|There were undefined references|Citation .* undefined|Reference .* undefined|Missing character" main.log

      - name: Commit final source only
        shell: bash
        run: |
          rm -f .github/workflows/fix-p015-source-id.yml .github/workflows/fix-p015-source-id-pr.yml
          git config user.name "Yu-Ning Tsao"
          git config user.email "186167885+OscarTsao@users.noreply.github.com"
          git add school/main.tex .github/workflows/fix-p015-source-id.yml .github/workflows/fix-p015-source-id-pr.yml
          git diff --cached --check
          git commit -m "Clarify LingxiDiag source and blinded case IDs"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
