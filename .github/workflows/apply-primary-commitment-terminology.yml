name: Apply primary-commitment terminology consistency

on:
  push:
    branches:
      - agent/tfidf-cross-corpus-framing
    paths:
      - .github/workflows/apply-primary-commitment-terminology.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tfidf-cross-corpus-framing
          fetch-depth: 0

      - name: Apply terminology updates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('school/main.tex')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  'Gold label ranked and criterion-compatible but not selected & 0 & 1 & 1',
                  'Gold label ranked and criterion-compatible but not committed as primary & 0 & 1 & 1',
              ),
              (
                  'Yes & Yes & No & 272 (29.7\\%) & Ranked and compatible; not selected\\\\',
                  'Yes & Yes & No & 272 (29.7\\%) & Ranked and compatible; not committed as primary\\\\',
              ),
              (
                  '12 cases in which a gold parent is ranked but absent from the compatible set and not selected, and 272 cases in which a gold parent is ranked and compatible but not selected.',
                  '12 cases in which a gold parent is ranked but absent from the compatible set and another diagnosis is committed as primary, and 272 cases in which a gold parent is ranked and compatible but another diagnosis is committed as primary.',
              ),
              (
                  'The 272 internal cases and 225 external cases with a ranked and compatible reference diagnosis that is not selected are therefore best described as the largest recorded benchmark-disagreement profiles.',
                  'The 272 internal cases and 225 external cases in which a reference diagnosis is ranked and compatible but no benchmark-reference parent is committed as primary are therefore best described as the largest recorded benchmark-disagreement profiles.',
              ),
              (
                  'Yes, the same output views can be applied to MDD-5k, and the largest external disagreement profile also contains a ranked and compatible reference diagnosis that is not selected.',
                  'Yes, the same output views can be applied to MDD-5k, and the largest external disagreement profile also contains a ranked and compatible reference diagnosis while no benchmark-reference parent is committed as primary.',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected one match, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate terminology and diff
        run: |
          grep -Fq 'Gold label ranked and criterion-compatible but not committed as primary' school/main.tex
          grep -Fq 'Ranked and compatible; not committed as primary' school/main.tex
          grep -Fq 'no benchmark-reference parent is committed as primary are therefore best described' school/main.tex
          grep -Fq 'while no benchmark-reference parent is committed as primary' school/main.tex
          git diff --check

      - name: Remove workflow and commit
        run: |
          rm .github/workflows/apply-primary-commitment-terminology.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align primary-commitment terminology'
          git push origin HEAD:agent/tfidf-cross-corpus-framing
