name: Apply shortened one-page abstracts

on:
  push:
    branches:
      - agent/shorten-thesis-abstract
    paths:
      - .github/workflows/apply-shorten-thesis-abstract.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/shorten-thesis-abstract
          fetch-depth: 0

      - name: Shorten Chinese and English abstracts
        run: python3 .github/apply_shorten_thesis_abstract.py school/main.tex

      - name: Validate abstract content and length
        run: |
          grep -Fq '針對部分 LingxiDiag 案例的盲性精神科醫師標注仍待完成' school/main.tex
          grep -Fq 'A blinded psychiatrist annotation study on selected LingxiDiag cases remains pending' school/main.tex
          grep -Fq '109 of 518' school/main.tex || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          zh_start = text.index(r'\chapter*{中文摘要}')
          zh_end = text.index(r'\noindent\textbf{關鍵詞：}', zh_start)
          en_start = text.index(r'\chapter*{Abstract}', zh_end)
          en_end = text.index(r'\noindent\textbf{Keywords:}', en_start)
          zh = text[zh_start:zh_end]
          en = text[en_start:en_end]
          zh_nonspace = len(re.sub(r'\s+', '', zh))
          en_words = len(re.findall(r"[A-Za-z0-9]+(?:[-'][A-Za-z0-9]+)*", en))
          assert zh_nonspace <= 700, zh_nonspace
          assert en_words <= 280, en_words
          assert text.count(r'\chapter*{中文摘要}') == 1
          assert text.count(r'\chapter*{Abstract}') == 1
          print({'zh_nonspace': zh_nonspace, 'en_words': en_words})
          PY
          git diff --check

      - name: Remove one-time files and commit
        run: |
          rm .github/apply_shorten_thesis_abstract.py
          rm .github/workflows/apply-shorten-thesis-abstract.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Shorten thesis abstracts to one-page length'
          git push origin HEAD:agent/shorten-thesis-abstract
