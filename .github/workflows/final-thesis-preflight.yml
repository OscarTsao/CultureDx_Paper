name: Final thesis preflight

on:
  push:
    branches:
      - agent/final-thesis-preflight
    paths:
      - .github/workflows/final-thesis-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preflight branch
        uses: actions/checkout@v4
        with:
          ref: agent/final-thesis-preflight
          fetch-depth: 0

      - name: Apply final source corrections
        run: python3 .github/final_thesis_preflight.py school/main.tex school/references.bib

      - name: Validate source consistency
        run: |
          grep -Fq '\newif\ifshowcomments \showcommentsfalse' school/main.tex
          grep -Fq 'Blinded Psychiatrist Annotation Protocol (Pending)' school/main.tex
          grep -Fq 'Case annotation and analysis remain pending.' school/main.tex
          grep -Fq 'Retrieval produces higher Top-1 point estimates' school/main.tex
          grep -Fq 'The MDD-5k stage-wise analysis provides the direct evidence for RQ5.' school/main.tex
          grep -Fq 'second-ranked class is additionally emitted when its probability is at least 0.30' school/main.tex
          ! grep -Fq '\label{tab:scope-expansion-results}' school/main.tex
          ! grep -Fq 'Retrieval provides a clear Top-1 benefit for the direct Single configuration.' school/main.tex
          ! grep -Fq '\section{Blinded Psychiatrist Annotation Pilot}' school/main.tex
          grep -Fq 'Sun, Xin and Wang, Junxiao' school/references.bib
          grep -A5 '@article{wang2025medkgi' school/references.bib | grep -Fq 'year    = {2025}'
          git diff --check

      - name: Install XeLaTeX toolchain and fonts
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-xetex texlive-latex-extra texlive-publishers \
            texlive-lang-chinese fonts-liberation fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile thesis with XeLaTeX and BibTeX
        run: |
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          test -s main.log

      - name: Build preflight report
        run: |
          cd school
          {
            echo "Final thesis preflight"
            echo "======================"
            pdfinfo main.pdf | grep -E '^(Pages|Page size|File size):' || true
            echo "Overfull hbox: $(grep -c 'Overfull \\hbox' main.log || true)"
            echo "Overfull vbox: $(grep -c 'Overfull \\vbox' main.log || true)"
            echo "Underfull hbox: $(grep -c 'Underfull \\hbox' main.log || true)"
            echo "Underfull vbox: $(grep -c 'Underfull \\vbox' main.log || true)"
            echo "Missing characters: $(grep -c 'Missing character:' main.log || true)"
          } > preflight-report.txt
          grep -E 'Overfull \\hbox|Overfull \\vbox|Underfull \\hbox|Underfull \\vbox' main.log > preflight-layout-warnings.txt || true
          pdffonts main.pdf > preflight-fonts.txt
          cat preflight-report.txt

      - name: Upload compiled preflight artifact
        uses: actions/upload-artifact@v4
        with:
          name: CultureDx-Paper-final-thesis-preflight
          path: |
            school/main.pdf
            school/main.log
            school/preflight-report.txt
            school/preflight-layout-warnings.txt
            school/preflight-fonts.txt
          retention-days: 14

      - name: Fail on unresolved references, citations, labels, or glyphs
        run: |
          if grep -E -q 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log; then
            grep -E 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' school/main.log || true
            exit 1
          fi

      - name: Remove generated and one-time files, then commit
        run: |
          cd school
          latexmk -C main.tex || true
          rm -f main.pdf preflight-report.txt preflight-layout-warnings.txt preflight-fonts.txt
          cd ..
          rm -f .github/final_thesis_preflight.py
          rm -f .github/workflows/final-thesis-preflight.yml
          git add -A
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev '^(school/main.tex|school/references.bib|\.github/final_thesis_preflight.py|\.github/workflows/final-thesis-preflight.yml)$' || true)
          test -z "$unexpected"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Complete final thesis preflight corrections'
          git push origin HEAD:agent/final-thesis-preflight
