name: Verify Chapter 3 thesis build v2

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/verify_thesis_ch3_v2.yml
      - school/main.tex
      - figures/fig_single_vs_hied_architecture.pdf
      - figures/fig_worked_example_flow.pdf
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2

      - name: Install XeLaTeX and rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese fonts-noto-cjk fonts-urw-base35 poppler-utils

      - name: Render Chapter 3 figures
        run: |
          mkdir -p verification_renders
          pdftoppm -png -r 180 -singlefile figures/fig_single_vs_hied_architecture.pdf verification_renders/fig_single_vs_hied_architecture
          pdftoppm -png -r 180 -singlefile figures/fig_worked_example_flow.pdf verification_renders/fig_worked_example_flow

      - name: Compile thesis
        run: |
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error school/main.tex

      - name: Record build diagnostics
        shell: bash
        run: |
          set -euo pipefail
          test -s main.pdf
          test -s verification_renders/fig_single_vs_hied_architecture.png
          test -s verification_renders/fig_worked_example_flow.png
          grep -E 'Overfull|Underfull|Warning' main.log > verification_renders/latex_warnings.txt || true
          pdfinfo main.pdf > verification_renders/main_pdfinfo.txt
          pdfinfo figures/fig_single_vs_hied_architecture.pdf > verification_renders/fig1_pdfinfo.txt
          pdfinfo figures/fig_worked_example_flow.pdf > verification_renders/fig2_pdfinfo.txt

      - name: Upload verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thesis-ch3-verification-v2
          path: |
            main.pdf
            main.log
            verification_renders/
          if-no-files-found: warn
          retention-days: 7
