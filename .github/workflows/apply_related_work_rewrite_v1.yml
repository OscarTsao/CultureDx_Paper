name: Apply Chapter 2 plain-English rewrite v1

on:
  push:
    branches:
      - thesis/post-defense-rewrite-v2
    paths:
      - .github/workflows/apply_related_work_rewrite_v1.yml
      - scripts/apply_related_work_rewrite_v1.py
      - scripts/related_work_v1/chapter2.tex
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-related-work-rewrite-v1
  cancel-in-progress: false

jobs:
  rewrite-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out thesis branch
        uses: actions/checkout@v4
        with:
          ref: thesis/post-defense-rewrite-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Chapter 2 rewrite
        run: python scripts/apply_related_work_rewrite_v1.py school/main.tex

      - name: Validate Chapter 2 source contracts
        shell: bash
        run: |
          set -euo pipefail
          target=school/main.tex
          git diff --check -- "$target"
          grep -F '\chapter{Related Work}' "$target"
          grep -F '\section{Psychiatric LLM Diagnosis}' "$target"
          grep -F '\section{Retrieval-Augmented Diagnostic Reasoning}' "$target"
          grep -F '\section{Medical Multi-Agent Reasoning}' "$target"
          grep -F '\section{Auditability and Criterion Grounding}' "$target"
          grep -F '\section{Primary-Diagnosis Selection}' "$target"
          grep -F '\section{Research Gap and Research Questions}' "$target"
          grep -F 'These are possible benefits, not guarantees.' "$target"
          grep -F 'Retrieved cases are examples from the training source, not medical evidence about the current patient.' "$target"
          grep -F 'Does the stage-wise analysis remain useful under a second synthetic source?' "$target"
          ! grep -Fq 'criterion verification' "$target"

      - name: Install complete XeLaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            texlive-lang-chinese texlive-publishers fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile complete thesis
        shell: bash
        run: |
          set -euo pipefail
          cd school
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          test -s main.pdf
          pdfinfo main.pdf | tee /tmp/main_pdfinfo.txt
          pdftotext -layout main.pdf /tmp/main.txt
          grep -F 'Related Work' /tmp/main.txt
          grep -F 'Retrieval-Augmented Diagnostic Reasoning' /tmp/main.txt
          grep -F 'Auditability and Criterion Grounding' /tmp/main.txt
          grep -F 'Research Gap and Research Questions' /tmp/main.txt
          if grep -Eiq 'undefined references|undefined citations|Citation .* undefined|Reference .* undefined' main.log; then
            echo 'Unresolved references or citations found.' >&2
            exit 1
          fi
          grep -E 'Overfull|Underfull|Warning' main.log > /tmp/main_warnings.txt || true
          cat /tmp/main_warnings.txt

      - name: Reject Chapter 2 overfull boxes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('school/main.tex').read_text(encoding='utf-8')
          log = Path('school/main.log').read_text(encoding='utf-8', errors='replace')
          start_pos = source.index(r'\chapter{Related Work}')
          end_pos = source.index(r'\chapter{Study Architectures and Diagnostic Workflow}', start_pos)
          start_line = source[:start_pos].count('\n') + 1
          end_line = source[:end_pos].count('\n') + 1
          offenders = []
          for match in re.finditer(r'Overfull .*? at lines (\d+)(?:--(\d+))?', log):
              lo = int(match.group(1))
              hi = int(match.group(2) or lo)
              if not (hi < start_line or lo > end_line):
                  offenders.append(match.group(0))
          if offenders:
              raise SystemExit('Chapter 2 contains overfull boxes: ' + '; '.join(offenders))
          print(f'Chapter 2 line range {start_line}-{end_line} has no overfull boxes')
          PY

      - name: Render Chapter 2 pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification_renders
          pages=$(pdfinfo school/main.pdf | awk '/^Pages:/ {print $2}')
          start_page=''
          end_page=''
          for page in $(seq 1 "$pages"); do
            pdftotext -f "$page" -l "$page" -layout school/main.pdf /tmp/page.txt
            if [ -z "$start_page" ] && grep -Fq 'Related Work' /tmp/page.txt; then
              start_page="$page"
            fi
            if [ -n "$start_page" ] && grep -Fq 'Study Architectures and Diagnostic Workflow' /tmp/page.txt; then
              end_page=$((page - 1))
              break
            fi
          done
          test -n "$start_page"
          test -n "$end_page"
          pdftoppm -png -r 150 -f "$start_page" -l "$end_page" school/main.pdf verification_renders/ch2
          printf 'Chapter 2 physical PDF pages: %s-%s\n' "$start_page" "$end_page" | tee /tmp/ch2_pages.txt
          test "$(find verification_renders -name 'ch2-*.png' | wc -l)" -ge 3

      - name: Commit verified Chapter 2 rewrite
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add school/main.tex
          if git diff --cached --quiet; then
            echo 'No Chapter 2 change to commit.'
            exit 0
          fi
          git commit -m 'Rewrite Chapter 2 in plain technical English'
          git push origin HEAD:thesis/post-defense-rewrite-v2

      - name: Upload Chapter 2 verification artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter2-plain-english-rewrite-v1
          path: |
            school/main.pdf
            school/main.log
            verification_renders/ch2-*.png
            /tmp/main_pdfinfo.txt
            /tmp/main_warnings.txt
            /tmp/ch2_pages.txt
          if-no-files-found: warn
          retention-days: 7
