name: Compile corrected thesis source v2

on:
  push:
    branches:
      - fix/ch4-metric-contract-paper
    paths:
      - .github/workflows/compile_ch4_fix_v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out paper
        uses: actions/checkout@v4

      - name: Compile with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: school
          latexmk_use_xelatex: true
          extra_system_packages: "font-liberation font-urw-base35 font-noto-cjk poppler-utils"
          pre_compile: "fc-cache -f && fc-match 'Liberation Serif' && fc-match 'Nimbus Sans' && fc-match 'Noto Serif CJK TC'"
          args: -file-line-error -halt-on-error -interaction=nonstopmode

      - name: Verify PDF
        run: |
          test -s school/main.pdf
          ls -lh school/main.pdf

      - name: Upload compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: corrected-thesis-pdf
          path: school/main.pdf
          if-no-files-found: error
