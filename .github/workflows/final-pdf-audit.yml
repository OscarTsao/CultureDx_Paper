name: Final thesis PDF audit

on:
  push:
    branches:
      - agent/final-pdf-audit-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XeLaTeX and PDF tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-lang-chinese texlive-latex-extra \
            texlive-fonts-recommended texlive-bibtex-extra texlive-publishers \
            fonts-noto-cjk fonts-liberation2 fonts-urw-base35 poppler-utils
          fc-cache -f

      - name: Build thesis
        shell: bash
        working-directory: school
        run: |
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          xelatex -interaction=nonstopmode -halt-on-error main.tex
          if grep -Eq "Undefined control sequence|LaTeX Error|Package .* Error|Emergency stop|Fatal error|There were undefined references|Citation .* undefined|Reference .* undefined|Missing character" main.log; then
            exit 1
          fi
          pdfinfo main.pdf
          pdftotext main.pdf main.txt

      - name: Upload final audit bundle
        uses: actions/upload-artifact@v4
        with:
          name: final-thesis-pdf-audit
          path: |
            school/main.pdf
            school/main.log
            school/main.txt
            school/main.toc
            school/main.lof
            school/main.lot
          if-no-files-found: error
          retention-days: 2
