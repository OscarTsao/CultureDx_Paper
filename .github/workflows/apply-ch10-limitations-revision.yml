name: Apply Chapter 10 limitations revision

on:
  push:
    branches:
      - agent/refine-limitations-validity
    paths:
      - .github/workflows/apply-ch10-limitations-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/refine-limitations-validity
          fetch-depth: 0

      - name: Apply Chapter 10 revision
        run: python3 .github/apply_ch10_limitations_revision.py school/main.tex

      - name: Validate revised Chapter 10
        run: |
          grep -Fq 'Criterion compatibility introduces an additional construct limitation.' school/main.tex
          grep -Fq 'Results on the checker-eligible population are conditional results' school/main.tex
          grep -Fq 'The model-based components are not independent expert votes.' school/main.tex
          grep -Fq 'The 77,998 diagnosis-by-criterion states are clustered within cases' school/main.tex
          grep -Fq 'Even after completion, it can assess how psychiatrists interpret the selected synthetic cases' school/main.tex
          grep -Fq '\section{Chapter Summary}' school/main.tex
          python3 - <<'PY'
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          start = text.index(r'\chapter{Limitations and Threats to Validity}')
          end = text.index(r'\chapter{Conclusions and Future Work}')
          chapter = text[start:end]
          assert chapter.count(r'\section{') == 6
          assert chapter.count(r'\label{sec:model-comparison-limitations}') == 1
          assert chapter.count(r'\label{sec:statistical-reproducibility-limitations}') == 1
          assert chapter.count(r'\label{sec:clinical-deployment-boundaries}') == 1
          assert 'An earlier F60 scope-expansion result' not in chapter
          assert 'No supported quantitative conclusion is drawn from the earlier F60 scope-expansion experiment' in chapter
          PY
          git diff --check

      - name: Remove one-time files and commit
        run: |
          rm .github/apply_ch10_limitations_revision.py
          rm .github/workflows/apply-ch10-limitations-revision.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refine Chapter 10 validity boundaries'
          git push origin HEAD:agent/refine-limitations-validity
