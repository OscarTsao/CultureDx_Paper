name: Restore structured thesis abstract

on:
  push:
    branches:
      - agent/restore-structured-abstract

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out revision branch
        uses: actions/checkout@v4
        with:
          ref: agent/restore-structured-abstract
          fetch-depth: 0

      - name: Patch and validate thesis source
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/restore_structured_abstract.py
          git diff --check

      - name: Install thesis toolchain
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-xetex texlive-latex-extra texlive-publishers \
            texlive-lang-chinese fonts-liberation fonts-noto-cjk \
            fonts-urw-base35 poppler-utils

      - name: Compile and validate full thesis
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "OscarTsao/CultureDx_Paper" ]]; then
            WORKDIR="school"
            TEXFILE="main.tex"
            STEM="main"
          else
            WORKDIR="paper/school"
            TEXFILE="HiED_school_version.tex"
            STEM="HiED_school_version"
          fi
          cd "$WORKDIR"
          latexmk -xelatex -interaction=nonstopmode -halt-on-error -file-line-error "$TEXFILE"
          test -s "$STEM.pdf"
          test -s "$STEM.log"
          if grep -E -q 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' "$STEM.log"; then
            grep -E 'LaTeX Warning: (Citation|Reference).*undefined|Package natbib Warning: Citation.*undefined|There were undefined references|There were undefined citations|multiply defined|Missing character:' "$STEM.log" || true
            exit 1
          fi
          test "$(grep -c 'Overfull \\hbox' "$STEM.log" || true)" -eq 0
          test "$(grep -c 'Overfull \\vbox' "$STEM.log" || true)" -eq 0
          grep -Fq '\contentsline {chapter}{中文摘要}{i}' "$STEM.toc"
          grep -Fq '\contentsline {chapter}{Abstract}{ii}' "$STEM.toc"
          grep -Fq '\contentsline {chapter}{Acknowledgements}{iii}' "$STEM.toc"
          pages=$(pdfinfo "$STEM.pdf" | awk '/^Pages:/ {print $2}')
          test "$pages" -eq 105
          pdfinfo "$STEM.pdf" | grep -E '^(Pages|Page size):'

      - name: Commit source-only revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" == "OscarTsao/CultureDx_Paper" ]]; then
            WORKDIR="school"
            STEM="main"
            ALLOWED='^(school/main.tex|\.github/workflows/restore-structured-abstract.yml|\.github/scripts/restore_structured_abstract.py)$'
          else
            WORKDIR="paper/school"
            STEM="HiED_school_version"
            ALLOWED='^(paper/school/HiED_school_version.tex|\.github/workflows/restore-structured-abstract.yml|\.github/scripts/restore_structured_abstract.py)$'
          fi
          cd "$WORKDIR"
          latexmk -C "$STEM.tex" || true
          rm -f "$STEM".aux "$STEM".bbl "$STEM".blg "$STEM".fdb_latexmk \
            "$STEM".fls "$STEM".log "$STEM".lof "$STEM".lot "$STEM".out \
            "$STEM".pdf "$STEM".toc "$STEM".xdv
          cd - >/dev/null
          rm -f .github/workflows/restore-structured-abstract.yml
          rm -f .github/scripts/restore_structured_abstract.py
          rmdir .github/scripts 2>/dev/null || true
          git add -A
          git diff --cached --check
          unexpected=$(git diff --cached --name-only | grep -Ev "$ALLOWED" || true)
          test -z "$unexpected"
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git commit -m 'Restore structured bilingual abstract'
          git push origin HEAD:agent/restore-structured-abstract
