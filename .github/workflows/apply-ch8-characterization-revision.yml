name: Apply Chapter 8 characterization revision
# chapter-scoped validation retry

on:
  push:
    branches:
      - agent/tfidf-cross-corpus-framing
    paths:
      - .github/workflows/apply-ch8-characterization-revision.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/tfidf-cross-corpus-framing
          fetch-depth: 0

      - name: Apply targeted thesis edits
        run: python3 .github/apply_ch8_characterization_revision.py school/main.tex

      - name: Validate Chapter 8 structure
        run: |
          grep -Fq '\section{Analysis Scope}' school/main.tex
          grep -Fq '\section{Rank and Diagnostic Direction within the Primary-Commitment Disagreement Group}' school/main.tex
          grep -Fq '109 cases (21.0\% of the 518 primary-agreement cases)' school/main.tex
          grep -Fq '77,998 diagnosis-by-criterion states' school/main.tex
          grep -Fq 'These raw counts are not normalized by class prevalence' school/main.tex
          grep -Fq 'Deterministically selected examples from four recorded-output profiles are provided in Appendix' school/main.tex
          test "$(grep -Fc '\section{Selected Frozen-Output Examples}' school/main.tex)" -eq 1
          test "$(grep -Fc '\label{tab:audit-trace-examples}' school/main.tex)" -eq 1
          ! grep -Fq '\label{tab:ch8-joint-profiles}' school/main.tex
          python3 - <<'PY'
          from pathlib import Path
          text = Path('school/main.tex').read_text(encoding='utf-8')
          chapter8 = text.index(r'\chapter{Characterization of Recorded-Output Disagreements}')
          pointer = text.index(r'\paragraph{Frozen-record examples.}', chapter8)
          summary = text.index(r'\section{Chapter Summary}', pointer)
          discussion = text.index(r'\chapter{Discussion}', summary)
          assert chapter8 < pointer < summary < discussion
          appendix = text.index(r'\appendix')
          selected = text.index(r'\section{Selected Frozen-Output Examples}', appendix)
          auxiliary = text.index(r'\section{Auxiliary Primary-Selection Configurations}', selected)
          assert appendix < selected < auxiliary
          PY
          git diff --check

      - name: Remove one-time files and commit
        run: |
          rm .github/apply_ch8_characterization_revision.py
          rm .github/workflows/apply-ch8-characterization-revision.yml
          git config user.name 'OpenAI Codex'
          git config user.email 'noreply@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'Refine Chapter 8 disagreement characterization'
          git push origin HEAD:agent/tfidf-cross-corpus-framing
